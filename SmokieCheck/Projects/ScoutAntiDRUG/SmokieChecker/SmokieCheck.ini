#include <Arduino.h>
#include <Wire.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SSD1306.h>

#define SCREEN_WIDTH 128
#define SCREEN_HEIGHT 64
Adafruit_SSD1306 display(SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, -1);

// Hardware Pins (ESP32)
#define CO_SENSOR_PIN 34
#define SENSOR_POWER_PIN 27 
#define LED_GREEN_PIN 4
#define LED_RED_PIN   5
#define BUZZER_PIN    18
#define SWITCH        13    

// States ของระบบ
enum SystemState {
  STATE_READY,
  STATE_MEASURING
};

SystemState currentState = STATE_READY;

// ตัวแปรสำหรับจัดการ Debounce
int lastButtonState = HIGH;   
int buttonState = HIGH;       
unsigned long lastDebounceTime = 0;  
const unsigned long DEBOUNCE_DELAY = 50; 

// ตัวแปรสำหรับ Timing การวัดค่า
unsigned long lastSensorReadTime = 0;
const unsigned long SENSOR_INTERVAL = 200; 

float calculatePPM(int rawADC) {
  return (rawADC / 4095.0) * 100.0;
}

void evaluateCO(float ppm) {
  display.clearDisplay();
  display.setCursor(0, 0);
  display.print("CO Value: ");
  display.print(ppm, 1);
  display.println(" ppm");

  if (ppm <= 6.0) {
    digitalWrite(LED_GREEN_PIN, HIGH);
    digitalWrite(LED_RED_PIN, LOW);
    noTone(BUZZER_PIN);
    display.println("Status: Normal");
  } 
  else if (ppm >= 6.1 && ppm <= 10.0) {
    digitalWrite(LED_GREEN_PIN, HIGH);
    digitalWrite(LED_RED_PIN, HIGH); 
    noTone(BUZZER_PIN);
    display.println("Status: Risk/Light");
  } 
  else if (ppm >= 10.1 && ppm <= 15.0) {
    digitalWrite(LED_GREEN_PIN, LOW);
    digitalWrite(LED_RED_PIN, HIGH);
    tone(BUZZER_PIN, 1000);
    display.println("Status: Smoker!");
  } 
  else {
    digitalWrite(LED_GREEN_PIN, LOW);
    digitalWrite(LED_RED_PIN, (millis() / 250) % 2); 
    tone(BUZZER_PIN, 2000);
    display.println("Status: HEAVY SMOKER!");
  }
  
  display.display();
}

void showReadyScreen() {
  digitalWrite(LED_GREEN_PIN, LOW);
  digitalWrite(LED_RED_PIN, LOW);
  noTone(BUZZER_PIN);

  display.clearDisplay();
  display.setTextSize(2);
  display.setTextColor(SSD1306_WHITE);
  display.setCursor(25, 10);
  display.println("READY!");
  
  display.setTextSize(1);
  display.setCursor(5, 39);
  display.println("Press Button to Start");
  display.display();
}

void handleButton() {
  int reading = digitalRead(SWITCH);

  if (reading != lastButtonState) {
    lastDebounceTime = millis();
  }

  if ((millis() - lastDebounceTime) > DEBOUNCE_DELAY) {
    if (reading != buttonState) {
      buttonState = reading;

      // เมื่อมีการกดปุ่ม (Transition จาก HIGH ไป LOW)
      if (buttonState == LOW) {
        if (currentState == STATE_READY) {
          currentState = STATE_MEASURING;
          Serial.println("[STATE CHANGE] -> MEASURING");
        } else {
          currentState = STATE_READY;
          Serial.println("[STATE CHANGE] -> READY");
        }
      }
    }
  }

  lastButtonState = reading;
}

void setup() {
  Serial.begin(115200);
  
  pinMode(LED_GREEN_PIN, OUTPUT);
  pinMode(LED_RED_PIN, OUTPUT);
  pinMode(BUZZER_PIN, OUTPUT);
  pinMode(SWITCH, INPUT_PULLUP);
  
  pinMode(SENSOR_POWER_PIN, OUTPUT);
  digitalWrite(SENSOR_POWER_PIN, HIGH);

  if(!display.begin(SSD1306_SWITCHCAPVCC, 0x3C)) {
    Serial.println(F("OLED Allocation Failed"));
  } else {
    showReadyScreen();
  }
  
  Serial.println("System Initialized: Waiting for user action.");
}

void loop() {
  // 1. ตรวจจับการกดปุ่มตลอดเวลา
  handleButton();

  // 2. ประมวลผลตาม State
  if (currentState == STATE_READY) {
    // อยู่ในสภาวะเตรียมพร้อม แสดง READY! รอคนมากด
    showReadyScreen();
  } 
  else if (currentState == STATE_MEASURING) {
    // เมื่อกดปุ่มแล้ว ทำการวัดค่าทุกๆ 200ms
    if (millis() - lastSensorReadTime >= SENSOR_INTERVAL) {
      lastSensorReadTime = millis();
      
      int rawADC = analogRead(CO_SENSOR_PIN);
      float ppm = calculatePPM(rawADC);
      evaluateCO(ppm);
    }
  }
}